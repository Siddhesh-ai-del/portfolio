name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run perf` runs the full build (tsc -b type-check + vite build)
      # first, then prints the raw/gzip bundle report — the same gate used
      # phase-to-phase in docs/perf-baseline.md. It only fails when dist/
      # is empty, i.e. when the build itself broke.
      - name: Type-check, build, bundle report
        run: npm run perf
